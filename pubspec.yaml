name: institute_management_app
description: Institute Management System
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

   
  # State Management
   
  get: ^4.7.2
  get_storage: ^2.1.1

   
  # Networking
   
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

   
  # Fonts
   
  google_fonts: ^6.3.1

   
  # SVG
   
  flutter_svg: ^2.2.0

   
  # Device Info
   
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0

   
  # Storage
   
  path_provider: ^2.1.5

   
  # UUID
   
  uuid: ^4.5.1

   
  # Permissions
   
  permission_handler: ^12.0.1

   
  # Image Picker
   
  image_picker: ^1.2.0

   
  # File Picker
  
  file_picker: ^10.3.3

   
  # Open Files
   
  open_filex: ^4.7.0

   
  # Cached Images
   
  cached_network_image: ^3.4.1

   
  # Utilities
   
  intl: ^0.20.2
  url_launcher: ^6.3.2
  internet_connection_checker_plus: ^2.7.2
  connectivity_plus: ^7.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

#  assets:
#    - assets/images/
#    - assets/icons/
#    - assets/svg/
#    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700